eRecursos de acessibilidade\u003c/h2\u003e\u003c/div\u003e\\n\u003cdiv class=\\\"grid\\\"\u003e\u003cdiv class=\\\"card\\\"\u003e\u003cul\u003e\u003cli\u003eContraste adequado entre texto e fundo.\u003c/li\u003e\u003cli\u003eTipografia legível e tamanho confortável.\u003c/li\u003e\u003cli\u003eBotões e campos grandes, com rótulos claros.\u003c/li\u003e\u003cli\u003eÍcones acompanhados de texto, evitando depender apenas de símbolos.\u003c/li\u003e\u003cli\u003eMensagens de erro compreensíveis e orientação de correção.\u003c/li\u003e\u003cli\u003eNavegação consistente entre telas.\u003c/li\u003e\u003cli\u003eEvitar excesso de informações e oferecer conteúdo em formatos variados quando possível.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003cdiv class=\\\"card\\\"\u003e\u003ch3\u003eAplicação no protótipo\u003c/h3\u003e\u003cp\u003eAs telas utilizam organização simples, espaços entre componentes, botões de destaque, campos identificados e linguagem direta. Em uma implementação futura, recomenda-se validar contraste, teclado, leitores de tela, tamanho de texto e alternativas para conteúdo audiovisual.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n\u003csection id=\\\"final\\\"\u003e\u003cdiv class=\\\"section-title\\\"\u003e\u003cdiv class=\\\"num\\\"\u003e09\u003c/div\u003e\u003ch2\u003eConsiderações finais\u003c/h2\u003e\u003c/div\u003e\\n\u003cdiv class=\\\"card\\\"\u003e\u003cp\u003eO projeto \u003cstrong\u003eEstude com mais Facilidade\u003c/strong\u003e busca tornar a aprendizagem online mais organizada, acolhedora e acessível. A documentação percorre o processo de Design Thinking, desde o entendimento das necessidades até a proposta de telas e recursos de acessibilidade.\u003c/p\u003e\u003cp\u003eO protótipo de baixa fidelidade apresenta uma primeira organização das principais funcionalidades da plataforma e serve como base para o desenvolvimento das próximas versões.\u003c/p\u003e\u003cdiv class=\\\"callout yellow\\\"\u003e\u003cstrong\ e\u003cp\u003eAs pessoas que desejam aprender online precisam encontrar uma plataforma confiável, fácil de utilizar, com cursos claros, opções flexíveis e informações transparentes sobre preço, conteúdo e formato.\u003c/p\u003e\u003ch3\u003eNecessidades percebidas\u003c/h3\u003e\u003cul\u003e\u003cli\u003eConfiança na plataforma e nos cursos.\u003c/li\u003e\u003cli\u003eFlexibilidade para conciliar estudo, trabalho e rotina.\u003c/li\u003e\u003cli\u003eOrientação sobre como começar e acompanhar o aprendizado.\u003c/li\u003e\u003cli\u003eConteúdo apresentado de forma clara, com apoio e recursos variados.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\\n\u003cdiv class=\\\"card\\\"\u003e\u003ch3\u003eMapa de empatia — Sandra Gomes\u003c/h3\u003e\u003cp\u003eO mapa compartilhado retrata Sandra, 50 anos, que busca manter-se conectada ao mercado de trabalho e aprender, mas tem receio de dificuldades digitais e de experiências online pouco confiáveis.\u003c/p\u003e\u003cdiv class=\\\"callout yellow\\\"\u003e\u003cstrong\u003eO que ela sente e pensa:\u003c/strong\u003e valoriza oportunidades positivas, mas preocupa-se com erros, golpes e obstáculos de acesso.\u003c/div\u003e\u003cp\u003e\u003cstrong\u003eDores:\u003c/strong\u003e receio de não conseguir acessar ou utilizar a plataforma; insegurança com o ambiente digital.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eNecessidades:\u003c/strong\u003e confiança, orientação, aprendizagem simples e suporte.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\\n\u003cfigure class=\\\"card image-card\\\"\u003e\u003cimg src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABD8AAALfCAYAAABmXWn2AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAEnQAABJ0Ad5mH3gAAP+lSURBVHhe7P1plF3HdeeJ/s+db957c0YCSBAEQYCZIEENZIKUKJOyRFepNIGkPrxVXZ/6ddcjUv7Q660uyVZJ6ipLVaZs2ZRrrX5rvXKCntRvVbm77LZJArIllZYtExxEKROcycwEkJhznvPO03kfInacfeKemwMJgBj2L3Fxz4nYsSPOORFxI/aJwQHgLiwsYGlpCWNjYzh37hzm5xcQj8fxsY99DPv370N3dzfS6TQcx8Hq6irGx8dx/vx5zM3NoVqtYufOndi16zbs3XsHenp6 oas que representem potenciais usuários, com diferentes níveis de familiaridade com plataformas de estudo online.\u003c/p\u003e\u003ch3\u003eMateriais\u003c/h3\u003e\u003cul\u003e\u003cli\u003eProtótipo navegável (ou telas em sequência).\u003c/li\u003e\u003cli\u003eRoteiro de tarefas.\u003c/li\u003e\u003cli\u003eFicha de observação e registro de comentários.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\\n110: \u003cdiv class=\\\"card\\\"\u003e\u003ch3\u003eProcedimento\u003c/h3\u003e\u003col\u003e\u003cli\u003eExplicar que está sendo testada a interface, não a pessoa.\u003c/li\u003e\u003cli\u003eSolicitar que o participante realize tarefas sem instruções passo a passo.\u003c/li\u003e\u003cli\u003eObservar cliques, dúvidas, erros, hesitações e comentários.\u003c/li\u003e\u003cli\u003eAo final, perguntar o que foi fácil, difícil e o que mudaria.\u003c/li\u003e\u003cli\u003eRegistrar achados e priorizar melhorias.\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/div\u003e\\n111: \u003ch3\u003eRoteiro de tarefas\u003c/h3\u003e\u003cdiv class=\\\"card\\\"\u003e\u003ctable class=\\\"table\\\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTarefa\u003c/th\u003e\u003cth\u003eO que observar\u003c/th\u003e\u003cth\u003eCritério de sucesso\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e1. Criar uma conta\u003c/td\u003e\u003ctd\u003eCampos compreendidos? Encontrou o cadastro?\u003c/td\u003e\u003ctd\u003eCompleta o cadastro sem ajuda.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2. Entrar na plataforma\u003c/td\u003e\u003ctd\u003eIdentifica e preenche login?\u003c/td\u003e\u003ctd\u003eChega à área inicial.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3. Encontrar um curso\u003c/td\u003e\u003ctd\u003eBusca/categorias são fáceis?\u003c/td\u003e\u003ctd\u003eLocaliza um curso pretendido.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4. Entender preço e formato\u003c/td\u003e\u003ctd\u003eInforma u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cp\u003e\u003cstrong\u003eAnálise:\u003c/strong\u003e após os testes, agrupar os problemas por frequência e gravidade, destacar o que funcionou bem e indicar quais alterações serão aplicadas no protótipo.\u003c/p\u003e\u003c/div\u003e\\n113: \u003c/section\u003e\\n114: \u003csection id=\\\"acessibilidade\\\"\u003e\u003cdiv class=\\\"section-title\\\"\u003e\u003cdiv class=\\\"num\\\"\u003e09\u003c/div\u003e\u003ch2\u003eRecursos de acessibilidade\u003c/h2\u003e\u003c/div\u003e\\n115: \u003cdiv class=\\\"grid\\\"\u003e\u003cdiv class=\\\"card\\\"\u003e\u003cul\u003e\u003cli\u003eContraste adequado entre texto e fundo.\u003c/li\u003e\u003cli\u003eTipografia legível e tamanho confortável.\u003c/li\u003e\u003cli\u003eBotões e campos grandes, com rótulos claros.\u003c/li\u003e\u003cli\u003eÍcones acompanhados de texto, evitando depender apenas de símbolos.\u003c/li\u003e\u003cli\u003eMensagens de erro compreensíveis e orientação de correção.\u003c/li\u003e\u003cli\u003eNavegação consistente entre telas.\u003c/li\u003e\u003cli\u003eEvitar excesso de informações e oferecer conteúdo em formatos variados quando possível.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003cdiv class=\\\"card\\\"\u003e\u003ch3\u003eAplicação no protótipo\u003c/h3\u003e\u003cp\u003eAs telas utilizam organização simples, espaços entre componentes, botões de destaque, campos identificados e linguagem direta. Em uma implementação futura, recomenda-se validar contraste, teclado, leitores de tela, tamanho de texto e alternativas para conteúdo audiovisual.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\\n116: \u003csection id=\\\"final\\\"\u003e\u003cdiv class=\\\"section-title\\\"\u003e\u003cdiv class=\\\"num\\\"\u003e10\u003c/div\u003e\u003ch2\u003eConsiderações finais\u003c/h2\u003e\u003c/div\u003e\\n117: \u003cdiv class=\\\"card\\\"\u003e\u003cp\u003eO projeto \u003cstrong\u003eEstude com mais Facilidade\u003c/strong\u003e busca tornar a aprendizagem online mais organizada, acolhedora e acessível. A documentação percorre o processo de Design Thinking, desde o entendimento das necessidades até a proposta de telas e roteiro de avaliação.\u003c/p\u003e\u003cp\u003eO protótipo é um ponto de partida para validar a navegação com usuários. O teste de usabilidade permitirá identificar dificuldades, melhorar a clareza das informações e aperfeiçoar a experiência antes de uma implementação final.\u003c/p\u003e\u003cdiv class=\\\"callout yellow\\\"\u003e\u003cstrong\u003ePróximo passo:\u003c/strong\u003e realizar o teste com participantes, completar a análise dos resultados e registrar as mudanças feitas a partir dos feedbacks.\u003c/div\u003e\u003c/div\u003e\\n118: \u003c/section\u003e\\n119: \u003csection id=\\\"checklist\\\"\u003e\u003cdiv class=\\\"section-title\\\"\u003e\u003cdiv class=\\\"num\\\"\u003e✓\u003c/div\u003e\u003ch2\u003eChecklist de avaliação\u003c/h2\u003e\u003c/div\u003e\\n120: \u003cdiv class=\\\"card\\\"\u003e\u003cp\u003eMarque os itens conforme você confirmar que estão concluídos. O indicador é apenas um controle pessoal da apresentação.\u003c/p\u003e\u003cdiv class=\\\"progressbar\\\"\u003e\u003cspan id=\\\"bar\\\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cp id=\\\"progressText\\\"\u003e0 de 13 itens marcados\u003c/p\u003e\\n\",[],{},\"22116222-7e27-4343-a9fd-af8e068ea336\",{\"_334\":335,\"_336\":-5,\"_205\":1159},1795654294.368067,{\"_329\":244,\"_459\":460,\"_461\":-5,\"_330\":1158},{\"_211\":1151,\"_213\":20,\"_214\":1152,\"_216\":1153,\"_222\":223,\"_353\":20,\"_354\":20,\"_226\":227,\"_229\":980,\"_231\":232,\"_233\":981,\"_235\":981,\"_236\":223,\"_117\":118,\"_238\":1154,\"_240\":983,\"_342\":365,\"_368\":1155,\"_346\":1036,\"_242\":1156,\"_237\":11},{\"_324\":325,\"_326\":1157},[],[],\"daae0a4a-bd1d-4c3a-9588-94bbf531cc4b\",[244],[],[458],\"bash -lc python - \u003c\u003c'PY'\\nfrom pathlib import Path\\nimport re\\ns=Path('/mnt/data/estude_com_mais_ tador · Design Thinking\u003c/div\u003e\\n[L57] \u003ch1\u003eEstude com\u003cbr\u003emais Facilidade\u003c/h1\u003e\\n[L58] \u003cp\u003eUma proposta de plataforma de ensino online que permite aprender no próprio ritmo, explorar cursos e acompanhar o progresso de forma simples e acessível.\u003c/p\u003e\\n[L59] \u003cdiv class=\\\"buttons\\\"\u003e\u003ca class=\\\"btn\\\" href=\\\"https://miro.com/app/board/uXjVG8_tkOU=/?share_link_id=64418801319\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eAbrir Miro ↗\u003c/a\u003e\u003ca class=\\\"btn secondary\\\" href=\\\"https://miro.com/app/board/uXjVG8_tkOU=/?share_link_id=64418801319\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eVer protótipo / board ↗\u003c/a\u003e\u003ca class=\\\"btn secondary\\\" href=\\\"#prototipos\\\"\u003eExplorar telas\u003c/a\u003e\u003c/div\u003e\\n[L60] \u003c/div\u003e\u003c/header\u003e\\n[L61] \u003cnav\u003e\u003cdiv class=\\\"navinner\\\"\u003e\\n[L62] \u003ca href=\\\"#processo\\\"\u003eProcesso\u003c/a\u003e\u003ca href=\\\"#empatia\\\"\u003eEmpatia\u003c/a\u003e\u003ca href=\\\"#definicao\\\"\u003eDefinição\u003c/a\u003e\u003ca href=\\\"#persona\\\"\u003ePersona \u0026 jornada\u003c/a\u003e\u003ca href=\\\"#ideacao\\\"\u003eIdeação\u003c/a\u003e\u003ca href=\\\"#fluxo\\\"\u003eFluxo\u003c/a\u003e\u003ca href=\\\"#prototipos\\\"\u003eProtótipos\u003c/a\u003e\u003ca href=\\\"#teste\\\"\u003eUsabilidade\u003c/a\u003e\u003ca href=\\\"#acessibilidade\\\"\u003eAcessibilidade\u003c/a\u003e\u003ca href=\\\"#final\\\"\u003eConclusão\u003c/a\u003e\\n[L63] \u003c/div\u003e\u003c/nav\u003e\\n[L64] \u003cmain\u003e\\n[L65] \u003csection id=\\\"processo\\\"\u003e\u003cdiv class=\\\"section-title\\\"\u003e\u003cdiv class=\\\"num\\\"\u003e01\u003c/div\u003e\u003ch2\u003eIdentificação do processo de Design\u003c/h2\u003e\u003c/div\u003e\\n[L66] \u003cdiv class=\\\"card\\\"\u003e\u003cp\u003eO projeto foi organizado pelas etapas do \u003cstrong\u003eDesign Thinking\u003c/strong\u003e: compreender os usuários, definir o problema, gerar ideias, prototipar e testar. A documentação reúne os materiais produzidos durante as atividades de IHC.\u003c/p\u003e\\n[L67] \u003cdiv class=\\\"grid3\\\"\u003e\u003cdiv class=\\\"callout\\\"\u003e\u003cstrong\u003eEmpatia\u003c/strong\u003e\u003cbr\u003eConhecer dificuldades, desejos e contexto.\u003c/div\u003e\u003cdiv class=\\\"callout yellow\\\"\u003e\u003cstrong\u003eDefinição\u003c/strong\u003e\u003cbr\u003eOrganizar os achados e delimitar o desafio.\u003c/div\u003e\u003cdiv class=\\\"callout\\\"\u003e\u003cstrong\u003eIdeação · Prototipação · Teste\u003c/strong\u003e\u003cbr\u003ePropor, representar e avaliar soluções.\u003c/div\u003e\u003c/div\u003e\\n[L68] \u003cp\u003e\u003cstrong\u003eLink de referência:\u003c/strong\u003e \u003ca href=\\\"https://miro.com/app/board/uXjVG8_tkOU=/?share_link_id=64418801319\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003equadro do Miro\u003c/a\u003e.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\\n[L69] \u003csection id=\\\"empatia\\\"\u003e\u003cdiv class=\\\"section-title\\\"\u003e\u003cdiv class=\\\"num\\\"\u003e02\u003c/div\u003e\u003ch2\u003eEtapa 1 — Empatia\u003c/h2\u003e\u003c/div\u003e\\n[L70] \u003cdiv class=\\\"grid\\\"\u003e\u003cdiv class=\\\"card\\\"\u003e\u003ch3\u003eProblema escolhido\u003c/h3\u003e\u003cp\u003eAs pessoas que desejam aprender online precisam encontrar uma plataforma confiável, fácil de utilizar, com cursos claros, opções flexíveis e informações transparentes sobre preço, conteúdo e formato.\u003c/p\u003e\u003ch3\u003eNecessidades percebidas\u003c/h3\u003e\u003cul\u003e\u003cli\u003eConfiança na plataforma e nos cursos.\u003c/li\u003e\u003cli\u003eFlexibilidade para conciliar estudo, trabalho e rotina.\u003c/li\u003e\u003cli\u003eOrientação sobre como começar e acompanhar o aprendizado.\u003c/li\u003e\u003cli\u003eConteúdo apresentado de forma clara, com apoio e recursos variados.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\\n[L71] \u003cdiv class=\\\"card\\\"\u003e\u003ch3\u003eMapa de empatia — Sandra Gomes\u003c/h3\u003e\u003cp\u003eO mapa compartilhado retrata Sandra, 50 anos, que busca manter-se conectada ao mercado de trabalho e aprender, mas tem receio de dificuldades digitais e de experiências online pouco confiáveis.\u003c/p\u003e\u003cdiv class=\\\"callout yellow\\\"\u003e\u003cstrong\u003eO que ela sente e pensa:\u003c/strong\u003e valoriza oportunidades positivas, mas preocupa-se com erros, golpes e obstáculos de acesso.\u003c/div\u003e\u003cp\u003e\u003cstrong\u003eDores:\u003c/strong\u003e receio de não conseguir acessar ou utilizar a plataforma; insegurança com o ambiente digital.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eNecessidades:\u003c/strong\u003e confiança, orientação, aprendizagem simples e suporte.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\\n[L72] \u003cfigure class=\\\"card image-card\\\"\u003e\u003cimg src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABD8AAALfCAYAAABmXWn2AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAEnQAABJ0Ad5mH3gAAP+lSURBVHhe7P1plF3HdeeJ/s+db957c0YCSBAEQYCZIEENZIKUKJOyRFepNIGkPrxVXZ/6ddcjUv7Q660uyVZJ6ipLVaZs2ZRrrX5rvXKCntRvVbm77LZJArIllZYtExxEKROcycwEkJhznvPO03kfInacfeKemwMJgBj2L3Fxz4nYsSPOORFxI/aJwQHgLiwsYGlpCWNjYzh37hzm5xcQj8fxsY99DPv370N3dzfS6TQcx8Hq6irGx8dx/vx5zM3NoVqtYufOndi16zbs3XsHenp6AACO48BxHBB0zN0EQbi5cF0X5XIZExMTOHv2LC5evIjp6RkkEnGk02n09/fjrrvuQmtrKzKZjAnnOA5c18XS0hIWFhZw5swZnD17FnNzc1hZWcXnP/95/LN/9hsIhUIIhUK+OJvhum7DN9U/q6urWFlZwauvvopXfvEL5LJZFAoFfPGLX8QTTzyBWCxmZHk4SF0mCIIgCIIgCDckIQCoVCrIZrO4dOkSXn/9dfzoRz/Cc889h5MnRzA5OYl8Pm86J5VKBSsrq7hw4SJOnjyJl19+GaOjo5iZmUGxWEIoFDKy1OlAQEeEQ7JBYYI+zfw3YqvygiBsHdd1USgUMDc3h5MnX8Pf//3f4ec//zmGh4dx+fJlVCoV1Ot1AEAoFEI4HDbG0tbWVuzatQu33347br/9doTDYczOziCXy6JerweW22Zlmhsv+MdxHKRSKWzbtg1tbW1IxOMoFouYmZlBNps1YelDxhZbfzOC0iIIgiAIgiAIwodLGMB3/t2/+3cAgGq1hlKpiJmZaaytrRkjBr2lpbeuqjPgYHV1BaFQGP39fdi3bx96erYhlUrBdV3UajXk83msra1hZWUF2WzWdHp4h6JarSKXy2FtbQ2FQhGVShnQHYi1tTUsLy8jq9/KUrhSqYR8voCVlRUs
